name: app

# ci.yml runs this on pull requests and main, release.yml on tags
on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build, the calling ref when empty
        type: string
        default: ""

permissions:
  contents: read

env:
  DOBBY_COMMIT: "5dfc8546954ce3b3198132ab13fddb89ee92cdd7"
  FONT_TOOLS: "afdko==4.0.3 fonttools==4.66.1"

jobs:
  build:
    name: full app build
    # The MACOS_RUNNER and XCODE_APP repository variables can point at another image,
    # or at a self-hosted Mac: MACOS_RUNNER takes one label or a JSON list such as
    # ["self-hosted", "macOS"], XCODE_APP the Xcode there (xcode-select runs with sudo).
    # Unset, the job runs on the xcode-27 image as before.
    runs-on: ${{ startsWith(vars.MACOS_RUNNER, '[') && fromJSON(vars.MACOS_RUNNER) || vars.MACOS_RUNNER || 'xcode-27' }}
    # A cold run builds Boost, xz, zstd and libarchive from source; the caches below
    # keep later runs well under this.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref }}

      - name: Record the toolchain
        run: |
          sudo xcode-select -s "${{ vars.XCODE_APP || '/Applications/Xcode_27.0.app' }}"
          xcodebuild -version
          swift --version
          echo "macOS SDK $(xcrun --sdk macosx --show-sdk-version)"

      - name: Install cross compilers
        run: brew install mingw-w64 bison flex

      # Dobby, innoextract and libarchive build with cmake
      - name: Install cmake
        run: command -v cmake >/dev/null || brew install cmake

      - name: Clone Dobby at the pinned commit
        run: |
          git clone --no-checkout https://github.com/jmpews/Dobby.git vendor/dobby
          git -C vendor/dobby checkout $DOBBY_COMMIT

      - name: Restore Dobby build cache
        id: dobby-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: build/dobby
          key: dobby-xcode-27-${{ env.DOBBY_COMMIT }}-${{ runner.arch }}

      - name: Build Dobby
        if: steps.dobby-cache.outputs.cache-hit != 'true'
        run: make dobby

      - name: Restore the Wine trees
        id: wine-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      - name: Restore Proton tarball cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: scratch/proton-lsc
          key: proton-tarball-${{ hashFiles('lsteamclient/fetch.sh') }}

      - name: Build the dylib
        run: make all

      - name: Build the overlay shim
        run: make overlay-shim

      - name: Build helpers
        run: make iconmaker appinfo

      - name: Build the bridge
        run: make bridge

      # The caches hold the built outputs, keyed on their pins and build scripts, and
      # are saved right after the build so a later failing step does not lose them.
      # A restore predates the checkout, so touch it or make would rebuild it.
      - name: Restore innoextract build cache
        id: innoextract-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/innoextract
          key: innoextract-xcode-27-${{ runner.arch }}-${{ hashFiles('installer/innoextract/pins', 'installer/innoextract/build.sh') }}

      # build.sh builds Boost and xz from the pinned sources, not Homebrew's
      - name: Build innoextract
        run: |
          if [ "${{ steps.innoextract-cache.outputs.cache-hit }}" = true ]; then touch out/innoextract; fi
          make innoextract

      - name: Save innoextract build cache
        if: steps.innoextract-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/innoextract
          key: innoextract-xcode-27-${{ runner.arch }}-${{ hashFiles('installer/innoextract/pins', 'installer/innoextract/build.sh') }}

      - name: Restore libarchive build cache
        id: libarchive-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/libarchive.dylib
          key: libarchive-xcode-27-${{ runner.arch }}-${{ hashFiles('installer/libarchive/pins', 'installer/libarchive/build.sh') }}

      - name: Build libarchive
        run: |
          if [ "${{ steps.libarchive-cache.outputs.cache-hit }}" = true ]; then touch out/libarchive.dylib; fi
          make libarchive

      - name: Save libarchive build cache
        if: steps.libarchive-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: out/libarchive.dylib
          key: libarchive-xcode-27-${{ runner.arch }}-${{ hashFiles('installer/libarchive/pins', 'installer/libarchive/build.sh') }}

      - name: Save the Wine trees
        if: steps.wine-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            scratch/wine
            scratch/wine-build-dual
            scratch/wine-build-arm64
          key: wine-xcode-27-${{ hashFiles('bridge/setup-wine-tree.sh', 'bridge/register-components.diff') }}

      # fonts/build.sh skips the build when build/fonts.stamp matches fonts/;
      # the workflow hash covers the pinned FONT_TOOLS
      - name: Restore fonts build cache
        id: fonts-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            build/fonts
            build/fonts.stamp
          key: fonts-${{ hashFiles('fonts/**') }}-${{ hashFiles('.github/workflows/app.yml') }}

      - name: Install font tools
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          brew install fontforge gpatch
          python3 -m venv scratch/fontvenv
          scratch/fontvenv/bin/pip install $FONT_TOOLS
          echo "$PWD/scratch/fontvenv/bin" >> "$GITHUB_PATH"

      - name: Build the fonts
        run: make fonts

      - name: Stage the app payload
        run: make app-payload

      - name: Build the app
        run: make app

      - name: Check the minimum macOS version
        run: make -s mincheck

      - name: Check the translations
        run: make -s l10ncheck

      - name: Run the hermetic C suites
        run: |
          make -s sigcheck
          make -s callscheck
          make -s webpatch-fixtures
          make -s peicon-fixtures
          make -s panel-behavior
          make -s spawn-env
          make -s activatecheck
          make -s compatcheck
          make -s fps-counter-tests
          make -s compatsvc-check
          make -s libexport-check
          make -s services-check
          make -s webuicheck
          make -s shortcutcheck
          make -s launch-shell
          make -s envcheck
          make -s buildcheck
          make -s settingscheck
          make -s routecheck
          make -s bridgecheck
          make -s gamedrivecheck
          make -s launchercheck
          make -s seedcheck
          make -s packagingcheck

      - name: Run the Swift tests
        run: make -s app-tests

      - name: Run the InstallerKit tests
        run: make -s installer-tests

      - name: Scan the bundle for Game Porting Toolkit files
        run: sh packaging/redist-scan.sh out/Cartouche.app

      - name: Package the app bundle
        run: |
          mkdir -p out/artifact
          ditto -c -k --keepParent out/Cartouche.app out/artifact/Cartouche.zip

      - name: Upload the app bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Cartouche
          path: out/artifact
