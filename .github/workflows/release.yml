name: release

# Pushing a tag vX.Y.Z publishes a release, vX.Y.Z-beta.N a beta, and
# vX.Y.Z-test.N a pipeline test (before the first release only). docs/RELEASE.md
# lists the secrets and variables this needs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, when the tag push run failed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  meta:
    name: read the tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      bundle_version: ${{ steps.meta.outputs.bundle_version }}
      kind: ${{ steps.meta.outputs.kind }}
      channel: ${{ steps.meta.outputs.channel }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      critical: ${{ steps.meta.outputs.critical }}
      archive: ${{ steps.meta.outputs.archive }}
      bump_tap: ${{ steps.meta.outputs.bump_tap }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check the tag against version.h and CHANGELOG.md
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::$TAG is already released; delete that release first to publish it again"
            exit 1
          fi
          published=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 500 \
            --json tagName,isDraft --jq '.[] | select(.isDraft | not) | .tagName' | tr '\n' ' ')
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          python3 packaging/release.py meta "$TAG" --published "$published" | tee -a "$GITHUB_OUTPUT"

  build:
    needs: meta
    uses: ./.github/workflows/app.yml
    with:
      ref: ${{ needs.meta.outputs.tag }}

  publish:
    name: sign and publish
    needs: [meta, build]
    runs-on: ${{ vars.MACOS_RUNNER || 'xcode-27' }}
    environment: release
    permissions:
      contents: write
    env:
      TAG: ${{ needs.meta.outputs.tag }}
      VERSION: ${{ needs.meta.outputs.version }}
      BUNDLE_VERSION: ${{ needs.meta.outputs.bundle_version }}
      ARCHIVE: ${{ needs.meta.outputs.archive }}
      GH_TOKEN: ${{ github.token }}
    outputs:
      sha256: ${{ steps.checksum.outputs.sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}

      - uses: actions/download-artifact@v4
        with:
          name: Cartouche
          path: build

      - name: Check the built bundle
        run: |
          mkdir -p work dist
          ditto -x -k build/Cartouche.zip work
          plist=work/Cartouche.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$plist")" = "$BUNDLE_VERSION"
          test -n "$(/usr/libexec/PlistBuddy -c 'Print :SUPublicEDKey' "$plist")"
          make -s mincheck APP_BUNDLE=work/Cartouche.app

      - name: Import the signing certificate
        env:
          SIGNING_CERT_P12: ${{ secrets.SIGNING_CERT_P12 }}
          SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
        run: |
          if [ -z "$SIGNING_CERT_P12" ] || [ -z "$SIGNING_CERT_PASSWORD" ]; then
            echo "::error::SIGNING_CERT_P12 and SIGNING_CERT_PASSWORD must be set (docs/RELEASE.md)"
            exit 1
          fi
          sh packaging/signing/import-cert.sh "$RUNNER_TEMP/cartouche-signing.keychain-db"

      - name: Sign the app
        env:
          SIGNING_IDENTITY: ${{ vars.SIGNING_IDENTITY || 'Cartouche Self-Signed' }}
        run: |
          dr=$(sh packaging/signing/sign-app.sh work/Cartouche.app "$SIGNING_IDENTITY" \
            "$RUNNER_TEMP/cartouche-signing.keychain-db")
          echo "Designated requirement: \`$dr\`" >> "$GITHUB_STEP_SUMMARY"
          echo "$dr" > dist/designated-requirement.txt

      - name: Remove the signing keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/cartouche-signing.keychain-db" 2>/dev/null || true

      - name: Zip and scan
        run: |
          ditto -c -k --keepParent work/Cartouche.app "dist/$ARCHIVE"
          sh packaging/redist-scan.sh work/Cartouche.app "dist/$ARCHIVE"

      # install.sh reads releases/latest/download/SHA256SUMS to learn the archive
      # name and check it, so the file name never changes
      - name: Write the checksum
        id: checksum
        run: |
          python3 packaging/release.py checksums "dist/$ARCHIVE" --out dist/SHA256SUMS
          (cd dist && shasum -a 256 -c SHA256SUMS)
          echo "sha256=$(cut -d' ' -f1 dist/SHA256SUMS)" >> "$GITHUB_OUTPUT"
          echo "SHA-256: \`$(cat dist/SHA256SUMS)\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Write the release notes
        run: |
          python3 packaging/release.py notes "$VERSION" > dist/notes.md
          gh api markdown -f text="$(cat dist/notes.md)" -f mode=gfm -f context="$GITHUB_REPOSITORY" \
            > "dist/Cartouche-$VERSION.html"

      # The live feed is releases/latest/download/appcast.xml, on the newest
      # release that is not a beta
      - name: Fetch the published feed and recent archives
        id: previous
        run: |
          latest=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || true)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ -z "$latest" ]; then
            echo "No release yet, this is the first feed"
            exit 0
          fi
          gh release download "$latest" --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir prev
          cp prev/appcast.xml dist/previous-appcast.xml
          python3 packaging/release.py previous-archives dist/previous-appcast.xml --count 3 \
            | while read -r version url; do
                echo "Archive of $version for deltas"
                curl -fsSL --retry 3 -o "dist/$(basename "$url")" "$url"
              done

      - name: Resolve the Sparkle tools
        run: swift package resolve --package-path app

      - name: Make the signed appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          CHANNEL: ${{ needs.meta.outputs.channel }}
          CRITICAL: ${{ needs.meta.outputs.critical }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY must be set (docs/RELEASE.md)"
            exit 1
          fi
          sh packaging/make-appcast.sh dist "$VERSION" \
            "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" "$CHANNEL" "$CRITICAL"

      - name: Publish the GitHub release
        env:
          PRERELEASE: ${{ needs.meta.outputs.prerelease }}
          LATEST: ${{ steps.previous.outputs.latest }}
        run: |
          set -- "dist/$ARCHIVE" dist/SHA256SUMS dist/appcast.xml
          while read -r delta; do set -- "$@" "dist/$delta"; done < dist/deltas.txt
          if [ "$PRERELEASE" = true ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease --latest=false \
              --title "$VERSION" --notes-file dist/notes.md "$@"
            # Betas reach the Beta channel through the live feed
            if [ -n "$LATEST" ]; then
              gh release upload "$LATEST" --repo "$GITHUB_REPOSITORY" --clobber dist/appcast.xml
            else
              echo "::warning::No release yet, so no feed lists this beta"
            fi
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
              --title "$VERSION" --notes-file dist/notes.md "$@"
          fi

  tap:
    name: bump the Homebrew cask
    needs: [meta, publish]
    if: needs.meta.outputs.bump_tap == 'true'
    runs-on: ubuntu-latest
    env:
      TAP_REPOSITORY: ${{ vars.TAP_REPOSITORY || 'BRYANN2K/homebrew-cartouche' }}
      VERSION: ${{ needs.meta.outputs.version }}
      SHA256: ${{ needs.publish.outputs.sha256 }}
    steps:
      - name: Check the tap token
        env:
          TAP_TOKEN: ${{ secrets.TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::TAP_TOKEN must be set to push to $TAP_REPOSITORY (docs/RELEASE.md)"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.meta.outputs.tag }}
          path: cartouche

      - uses: actions/checkout@v4
        with:
          repository: ${{ env.TAP_REPOSITORY }}
          token: ${{ secrets.TAP_TOKEN }}
          path: tap

      - name: Write the cask
        run: |
          mkdir -p tap/Casks
          python3 cartouche/packaging/release.py cask --template cartouche/packaging/homebrew/cartouche.rb.in \
            --version "$VERSION" --sha256 "$SHA256" --out tap/Casks/cartouche.rb
          if [ ! -f tap/README.md ]; then cp cartouche/packaging/homebrew/tap-README.md tap/README.md; fi

      - name: Push the new cask
        working-directory: tap
        run: |
          git config user.name BRYANN2K
          git config user.email BRYANN2K@users.noreply.github.com
          git add Casks/cartouche.rb README.md
          if git diff --cached --quiet; then
            echo "The cask already names $VERSION"
            exit 0
          fi
          git commit -m "cartouche $VERSION"
          git push
