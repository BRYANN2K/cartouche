name: runner-manifest

# Publishes runners.json on the compat-data release, where the app looks for a
# newer list of Wine builds once a day. Runs when main changes the shipped copy.
# The copy is signed with the Sparkle key: the app refuses an unsigned or
# wrongly signed manifest (docs/RELEASE.md).
on:
  push:
    branches: [main]
    paths: [app/Sources/NotProtonApp/Resources/runners.json]
  workflow_dispatch:

permissions:
  contents: read

# Same group as compat-data's publish job: both --clobber the compat-data release
concurrency:
  group: compat-data
  cancel-in-progress: false

jobs:
  publish:
    # macOS because the signer is Sparkle's sign_update, the same tool that signs
    # the appcast. The release environment gates access to SPARKLE_PRIVATE_KEY.
    environment: release
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Check it against the published copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest=app/Sources/NotProtonApp/Resources/runners.json
          if gh release download compat-data --pattern runners.json --dir previous 2>/dev/null; then
            python3 packaging/runner_manifest.py check "$manifest" --published previous/runners.json
          else
            python3 packaging/runner_manifest.py check "$manifest"
          fi

      - name: Resolve the Sparkle tools
        run: swift package resolve --package-path app

      - name: Sign runners.json
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_PRIVATE_KEY must be set (docs/RELEASE.md)"
            exit 1
          fi
          bin=app/.build/artifacts/sparkle/Sparkle/bin
          manifest=app/Sources/NotProtonApp/Resources/runners.json
          sig=$(printf '%s' "$SPARKLE_PRIVATE_KEY" | "$bin/sign_update" -p --ed-key-file - "$manifest")
          if [ -z "$sig" ]; then
            echo "::error::sign_update gave no signature"
            exit 1
          fi
          printf '%s\n' "$sig" > runners.json.sig
          printf '%s' "$SPARKLE_PRIVATE_KEY" | "$bin/sign_update" --verify --ed-key-file - "$manifest" "$sig"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A prerelease is never "latest", so the Sparkle feed is unaffected
          if ! gh release view compat-data >/dev/null 2>&1; then
            gh release create compat-data --prerelease --latest=false \
              --title "Compatibility data" \
              --notes "Nightly compatibility data for Cartouche, built by .github/workflows/compat-data.yml. Sources: AppleGamingWiki (CC BY-NC-SA 3.0); ProtonDB (ODbL 1.0, the ProtonDB counts are shared under the same license); AreWeAntiCheatYet (MIT). Format: docs/schema/compat.schema.json."
          fi
          gh release upload compat-data \
            app/Sources/NotProtonApp/Resources/runners.json runners.json.sig --clobber
