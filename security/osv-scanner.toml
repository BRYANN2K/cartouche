# Accepted osv-scanner findings, each with a reason and an end date (docs/security/RELEASE-GATE.md).
# A lapsed ignoreUntil turns the finding back into a failure.

# semgrep 1.183.0 requires mcp==1.29.0 exactly and opentelemetry-api~=1.37.0
# (tools/ci/requirements-security.txt). The CI only runs `semgrep scan`: the MCP server and
# its HTTP transports never start, and no tracestate header reaches opentelemetry. The tool
# venv lives in the runner's temp folder and is gone after the job. Drop these once semgrep
# lifts the pins.
